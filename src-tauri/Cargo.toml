[package]
name = "macrocode"
version = "0.1.0"
description = "MacroCode — AI terminal desktop app"
authors = ["MacroCode"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "macrocode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"  # klasör seçme diyaloğu (tauri-apps/api/plugin-dialog JS tarafı)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-manual-roots", "rustls-tls-native-roots", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["process", "time", "io-util", "sync"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
