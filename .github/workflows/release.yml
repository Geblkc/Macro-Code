# MacroCode — sürüm dağıtımı.
#
# `vX.Y.Z` tag'i push edildiğinde (veya elle tetiklendiğinde):
#   • linux  → .deb + .rpm + .AppImage  (ubuntu-22.04, eski glibc ile uyumlu)
#   • windows → NSIS .exe + .msi
# Paketler toplanır, SHA256SUMS üretilir ve GitHub Release'e yüklenir.
# Sürüm bump'ı için: bash scripts/release.sh X.Y.Z

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (deb · rpm · AppImage)
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Tauri sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libgtk-3-dev librsvg2-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Testler
        run: |
          npx tsc --noEmit
          npm test
          # generate_context! `frontendDist: ../dist` ister — cargo test öncesi dist derlenmeli.
          npm run build
          cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Paketleri derle
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Topla
        run: |
          mkdir -p bundles
          cp src-tauri/target/release/bundle/deb/*.deb      bundles/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm      bundles/ 2>/dev/null || true
          # `.sig` dosyaları da alınır (updater latest.json için gerekli).
          cp src-tauri/target/release/bundle/appimage/*     bundles/ 2>/dev/null || true
          ls -lh bundles

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: bundles/
          if-no-files-found: error

  windows:
    name: Windows (NSIS .exe · .msi)
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Paketleri derle
        run: npm run tauri build -- --bundles nsis,msi

      - name: Topla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundles | Out-Null
          # `.sig` dosyaları da alınır (updater latest.json için gerekli).
          Copy-Item src-tauri/target/release/bundle/nsis/* bundles/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/msi/*  bundles/ -ErrorAction SilentlyContinue
          Get-ChildItem bundles

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: bundles/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [linux, windows]
    # Yalnızca `v*` tag push'unda yayınla (workflow_dispatch'ta da bir tag
    # seçilerek çalıştırılmalı — "Use workflow from" → tag).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Updater latest.json
        working-directory: bundles
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          APPIMAGE="$(ls MacroCode_*_amd64.AppImage | head -n1)"
          EXE="$(ls *-setup.exe | head -n1)"
          # Tauri imza dosyaları indirilen artifact'ların içinde gelir.
          APPIMAGE_SIG="$(cat "${APPIMAGE}.sig")"
          EXE_SIG="$(cat "${EXE}.sig")"

          # Sürüm notları: tag'deki bundles/releasenote.md varsa onu kullan.
          NOTES="$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/bundles/releasenote.md" || true)"
          [ -n "${NOTES}" ] || NOTES="MacroCode ${GITHUB_REF_NAME}"

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "${NOTES}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg appimage_url "${BASE}/${APPIMAGE}" \
            --arg appimage_sig "${APPIMAGE_SIG}" \
            --arg exe_url "${BASE}/${EXE}" \
            --arg exe_sig "${EXE_SIG}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": { signature: $appimage_sig, url: $appimage_url },
                "windows-x86_64": { signature: $exe_sig, url: $exe_url }
              }
            }' > latest.json
          cat latest.json

      - name: SHA256SUMS
        working-directory: bundles
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MacroCode ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bundles/*
